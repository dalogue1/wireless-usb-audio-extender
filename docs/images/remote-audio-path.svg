<svg xmlns="http://www.w3.org/2000/svg" width="730" height="430" viewBox="0 0 730 430" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest"><title>Microphone audio path on the remote board</title><desc>USB audio adapter, USB host driver (int32 samples), int16 blocks of 192 samples (4 ms) which also feed the level meter LED and the no-signal check, high-pass filter, low-pass filter (off by default), noise filter (in place), radio packet of 3 blocks (12 ms), encoded by the distance setting (near 16-bit PCM, normal 8-bit mu-law, far IMA ADPCM), sent by ESP-NOW to the local board.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0.5" y="0.5" width="729" height="429" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/><text x="24" y="28" font-size="12" font-weight="600" fill="#444441">CAPTURE</text><rect x="20" y="40" width="150" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="95.0" y="61.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#04342C">USB audio adapter</text><text x="95.0" y="79.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">microphone in</text><rect x="200" y="40" width="150" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="275.0" y="61.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#26215C">USB host driver</text><text x="275.0" y="79.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">int32 samples</text><rect x="380" y="40" width="150" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="455.0" y="61.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#26215C">int16 block</text><text x="455.0" y="79.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">192 samples = 4 ms</text><line x1="170" y1="70" x2="196" y2="70" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><line x1="350" y1="70" x2="376" y2="70" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="570" y="34" width="140" height="34" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/><text x="640.0" y="51.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Level meter LED</text><rect x="570" y="78" width="140" height="34" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/><text x="640.0" y="95.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">No-signal check</text><path d="M530 70 H550 V51 H566" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><path d="M550 70 V95 H566" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="640" y="130" text-anchor="middle" font-size="11" fill="#5F5E5A">see the sound as captured</text><path d="M455 100 V140 H150 V166" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><text x="24" y="160" font-size="12" font-weight="600" fill="#444441">FILTER AND SEND</text><rect x="20" y="170" width="150" height="60" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/><text x="95.0" y="191.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#412402">High-pass filter</text><text x="95.0" y="209.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#BA7517">200 Hz, on by default</text><rect x="200" y="170" width="150" height="60" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/><text x="275.0" y="191.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#412402">Low-pass filter</text><text x="275.0" y="209.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#BA7517">12 kHz, off by default</text><rect x="380" y="170" width="150" height="60" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/><text x="455.0" y="191.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#412402">Noise filter</text><text x="455.0" y="209.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#BA7517">in place</text><rect x="560" y="170" width="150" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="635.0" y="191.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#26215C">Radio packet</text><text x="635.0" y="209.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">3 blocks = 12 ms</text><rect x="552" y="260" width="166" height="92" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="635.0" y="279.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#26215C">Encoded by distance</text><text x="635.0" y="297.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">near: 16-bit PCM</text><text x="635.0" y="315.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">normal: 8-bit µ-law</text><text x="635.0" y="333.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">far: IMA ADPCM</text><line x1="170" y1="200" x2="196" y2="200" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><line x1="350" y1="200" x2="376" y2="200" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><line x1="530" y1="200" x2="556" y2="200" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><line x1="635" y1="230" x2="635" y2="256" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><line x1="635" y1="352" x2="635" y2="388" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="635" y="408" text-anchor="middle" font-size="13" font-weight="600" fill="#26215C">ESP-NOW to the local board</text><text x="24" y="392" font-size="12" fill="#444441">Solid arrows: the audio itself. Dashed: read only, or over the radio.</text><text x="24" y="412" font-size="12" fill="#444441">All at 48 kHz, mono. Each packet decodes on its own.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>