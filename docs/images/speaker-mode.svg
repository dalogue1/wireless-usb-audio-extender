<svg xmlns="http://www.w3.org/2000/svg" width="680" height="354" viewBox="0 0 680 354" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img"><title>Speaker mode</title><desc>Computer audio player, local XIAO ESP32-S3, ESP-NOW radio, remote XIAO ESP32-S3, OTG splitter with 5 V supply, USB audio adapter, powered speaker in its headphone jack.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0.5" y="0.5" width="679" height="353" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/><rect x="30" y="40" width="190" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/><text x="125.0" y="59" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Computer</text><text x="125.0" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Any audio player</text><rect x="250" y="40" width="120" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="310.0" y="59" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#26215C">Local board</text><text x="310.0" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">XIAO ESP32-S3</text><rect x="500" y="40" width="140" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="570.0" y="59" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#26215C">Remote board</text><text x="570.0" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">XIAO ESP32-S3</text><rect x="500" y="170" width="140" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="570.0" y="189" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#04342C">OTG splitter</text><text x="570.0" y="208" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">With charging input</text><rect x="270" y="170" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="355.0" y="189" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#04342C">USB audio adapter</text><text x="355.0" y="208" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">UAC1, e.g. UGREEN</text><rect x="60" y="170" width="150" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/><text x="135.0" y="189" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Powered speaker</text><text x="135.0" y="208" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">In headphone jack</text><rect x="500" y="290" width="140" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/><text x="570.0" y="312.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">5 V supply, 1 A+</text><line x1="224" y1="68" x2="246" y2="68" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><line x1="374" y1="68" x2="496" y2="68" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><line x1="570" y1="100" x2="570" y2="166" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><line x1="496" y1="198" x2="444" y2="198" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><line x1="266" y1="198" x2="214" y2="198" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><line x1="570" y1="288" x2="570" y2="230" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><text x="435" y="54" text-anchor="middle" font-size="12" fill="#5F5E5A">ESP-NOW radio</text><text x="435" y="90" text-anchor="middle" font-size="12" fill="#5F5E5A">no Wi-Fi network</text><text x="40" y="316" font-size="12" fill="#444441">The PC sees a USB speaker: "Extender Speaker 1"</text></svg>
