<svg xmlns="http://www.w3.org/2000/svg" width="680" height="250" viewBox="0 0 680 250" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img"><title>AtomS3U remote</title><desc>Computer running BirdNET-Go or BirdNET-Pi, local XIAO ESP32-S3, ESP-NOW radio, AtomS3U remote with built-in microphone powered by a 5 V USB-A supply.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0.5" y="0.5" width="679" height="249" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/><rect x="30" y="40" width="190" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/><text x="125.0" y="59" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Computer</text><text x="125.0" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">BirdNET-Go or BirdNET-Pi</text><rect x="250" y="40" width="130" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="315.0" y="59" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#26215C">Local board</text><text x="315.0" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">XIAO ESP32-S3</text><rect x="500" y="40" width="150" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="575.0" y="59" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#26215C">Remote board</text><text x="575.0" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">AtomS3U, built-in mic</text><rect x="500" y="160" width="150" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/><text x="575.0" y="182.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">5 V USB-A supply</text><line x1="246" y1="68" x2="224" y2="68" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><line x1="496" y1="68" x2="384" y2="68" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><line x1="575" y1="158" x2="575" y2="100" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><text x="440" y="54" text-anchor="middle" font-size="12" fill="#5F5E5A">ESP-NOW radio</text><text x="440" y="90" text-anchor="middle" font-size="12" fill="#5F5E5A">no Wi-Fi network</text><text x="40" y="186" font-size="12" fill="#444441">The AtomS3U plugs straight into the power supply.</text><text x="40" y="206" font-size="12" fill="#444441">The PC sees a USB microphone: "Extender Mic 1"</text></svg>